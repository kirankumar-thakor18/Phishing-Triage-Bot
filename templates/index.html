<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing & Threat Intelligence Triage Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h3>🛡️ Phishing Triage & Threat Intel Dashboard</h3>
                    </div>
                    <div class="card-body">
                        <form action="/analyze" method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="email_file" class="form-label">Upload Suspicious Email (.eml)</label>
                                <input class="form-control" type="file" id="email_file" name="email_file" accept=".eml" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Analyze Email & Check Threat Intel</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
